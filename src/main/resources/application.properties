spring.application.name=homecloud
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/homecloud}
spring.datasource.username=${DB_USERNAME:homecloud}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}
homecloud.storage.root=/home/cid/homecloud-storage
logging.level.com.homecloud=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG


spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.enabled=true

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml