spring.application.name=homecloud

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.default_schema=homecloud
spring.liquibase.default-schema=homecloud
spring.liquibase.liquibase-schema=homecloud

jwt.secret=${JWT_SECRET}

homecloud.storage.root=${STORAGE_ROOT:/homecloud-storage}

logging.level.com.homecloud=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

spring.jpa.hibernate.ddl-auto=validate

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-exception=false